<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JARVIS</title>
<style>
  :root {
    --blue: #37c8ff;
    --blue-soft: rgba(55, 200, 255, 0.35);
    --panel: rgba(8, 24, 46, 0.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", sans-serif;
    color: #cfe9ff;
    background:
      radial-gradient(circle at 45% 40%, #0d2c52 0%, #071630 45%, #040b17 100%);
    letter-spacing: 0.4px;
  }

  /* ---------- HUD frame ---------- */
  .hud { position: fixed; inset: 10px; border: 1px solid rgba(55,200,255,.18); pointer-events: none; z-index: 5; }
  .corner { position: absolute; width: 26px; height: 26px; border: 2px solid var(--blue); }
  .c-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .c-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .c-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .c-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .topbar {
    position: fixed; top: 18px; left: 0; right: 0; z-index: 6;
    display: flex; justify-content: space-between; padding: 0 44px;
    font-size: 13px; color: var(--blue-soft); text-transform: uppercase;
  }
  .topbar .name { color: var(--blue); letter-spacing: 6px; font-weight: 600; }
  #status { color: var(--blue); }

  .layout { display: flex; height: 100vh; padding: 54px 26px 26px; gap: 18px; }

  /* ---------- Orb ---------- */
  .stage {
    flex: 1; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #particles { position: absolute; inset: 0; width: 100%; height: 100%; }

  .orb-wrap {
    position: relative; width: 330px; height: 330px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .3s ease;
  }
  .ring {
    position: absolute; border-radius: 50%;
    border: 1px solid var(--blue-soft);
    animation: spin 14s linear infinite;
  }
  .ring.r1 { width: 100%; height: 100%; border-top-color: var(--blue); border-bottom-color: transparent; }
  .ring.r2 { width: 84%; height: 84%; animation-duration: 9s; animation-direction: reverse;
             border-left-color: var(--blue); border-right-color: transparent; }
  .ring.r3 { width: 118%; height: 118%; animation-duration: 26s; border-style: dashed;
             opacity: .35; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .orb-core {
    width: 170px; height: 170px; border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #eaffff 0%, #7fe3ff 18%, #2aa9f0 45%, #0b4f8a 75%, #06264a 100%);
    box-shadow:
      0 0 40px rgba(55,200,255,.75),
      0 0 110px rgba(55,200,255,.45),
      inset 0 0 40px rgba(255,255,255,.35);
    animation: breathe 4s ease-in-out infinite;
    transition: box-shadow .4s ease;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }

  .ripple {
    position: absolute; width: 170px; height: 170px; border-radius: 50%;
    border: 2px solid var(--blue); opacity: 0;
  }
  @keyframes ripple {
    0% { transform: scale(1); opacity: .8; }
    100% { transform: scale(2.1); opacity: 0; }
  }

  .state-label {
    margin-top: 34px; font-size: 13px; letter-spacing: 5px;
    color: var(--blue-soft); text-transform: uppercase;
  }

  /* speaking / thinking states */
  body.speaking .orb-core {
    animation: speakPulse .55s ease-in-out infinite;
    box-shadow: 0 0 60px rgba(120,240,255,.95), 0 0 150px rgba(55,200,255,.6), inset 0 0 50px rgba(255,255,255,.5);
  }
  body.speaking .ripple { animation: ripple 1.4s ease-out infinite; }
  @keyframes speakPulse {
    0%, 100% { transform: scale(1.0); }
    50% { transform: scale(1.09); }
  }
  body.thinking .orb-core {
    animation: thinkSpin 1.6s linear infinite;
    background: conic-gradient(from 0deg, #06264a, #37c8ff, #06264a, #7fe3ff, #06264a);
  }
  @keyframes thinkSpin { to { filter: hue-rotate(360deg); } }
  body.thinking .ring { animation-duration: 2.5s; }

  /* ---------- Chat panel ---------- */
  .panel {
    width: 430px; display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid rgba(55,200,255,.25);
    border-radius: 10px;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 30px rgba(0,0,0,.45);
    overflow: hidden;
  }
  .panel-title {
    padding: 14px 18px; font-size: 13px; letter-spacing: 4px; color: var(--blue);
    border-bottom: 1px solid rgba(55,200,255,.2);
    text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #46ff9a; box-shadow: 0 0 8px #46ff9a; }

  .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: rgba(55,200,255,.3); border-radius: 3px; }

  .msg { max-width: 85%; padding: 9px 13px; border-radius: 10px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: rgba(55,200,255,.18); border: 1px solid rgba(55,200,255,.35); }
  .msg.jarvis { align-self: flex-start; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
  .msg.error { border-color: rgba(255,90,90,.6); color: #ffb3b3; }
  .msg .who { display: block; font-size: 10px; letter-spacing: 2px; color: var(--blue-soft); margin-bottom: 4px; text-transform: uppercase; }

  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid rgba(55,200,255,.2); }
  #input {
    flex: 1; background: rgba(4,14,28,.8); color: #eaf7ff;
    border: 1px solid rgba(55,200,255,.35); border-radius: 6px;
    padding: 11px 13px; font-size: 14px; outline: none;
  }
  #input:focus { border-color: var(--blue); box-shadow: 0 0 10px rgba(55,200,255,.4); }
  .btn {
    border: 1px solid rgba(55,200,255,.45); background: rgba(55,200,255,.15);
    color: var(--blue); border-radius: 6px; padding: 0 16px; font-size: 13px;
    letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
  }
  .btn:hover { background: rgba(55,200,255,.3); }
  .mic {
    width: 44px; padding: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .mic:disabled { opacity: .35; cursor: not-allowed; }
  .mic.active {
    background: var(--blue); color: #04101f;
    box-shadow: 0 0 14px rgba(55,200,255,.8);
    animation: micPulse 1.5s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 10px rgba(55,200,255,.6); }
    50% { box-shadow: 0 0 22px rgba(55,200,255,1); }
  }

  /* listening state */
  body.listening .orb-core {
    box-shadow: 0 0 50px rgba(55,200,255,.9), 0 0 130px rgba(55,200,255,.5), inset 0 0 45px rgba(255,255,255,.4);
    animation: breathe 2.4s ease-in-out infinite;
  }
  body.listening .ring { animation-duration: 7s; }
</style>
</head>
<body>

<div class="hud">
  <span class="corner c-tl"></span><span class="corner c-tr"></span>
  <span class="corner c-bl"></span><span class="corner c-br"></span>
</div>

<div class="topbar">
  <span class="name">J.A.R.V.I.S</span>
  <span id="status">IDLE</span>
</div>

<div class="layout">
  <div class="stage">
    <canvas id="particles"></canvas>
    <div class="orb-wrap" id="orb">
      <div class="ring r3"></div>
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ripple"></div>
      <div class="orb-core"></div>
    </div>
    <div class="state-label" id="stateLabel">Systems online</div>
  </div>

  <div class="panel">
    <div class="panel-title"><span>Conversation</span><span class="dot"></span></div>
    <div class="chat" id="chat">
      <div class="msg jarvis"><span class="who">Jarvis</span>Hello, I am Jarvis. How can I help you?</div>
    </div>
    <div class="composer">
      <button class="btn mic" id="micBtn" title="On/off voice input - say 'Jarvis' to talk to her">&#127908;</button>
      <input id="input" autocomplete="off" placeholder="Type a message...">
      <button class="btn" id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const statusEl = document.getElementById('status');
  const stateLabel = document.getElementById('stateLabel');
  let currentMsg = null;

  const LABELS = {
    idle: 'Systems online',
    thinking: 'Thinking...',
    speaking: 'Speaking',
    listening: "Listening - say 'Jarvis'"
  };

  function setState(state) {
    document.body.className = state === 'idle' ? '' : state;
    statusEl.textContent = state.toUpperCase();
    stateLabel.textContent = LABELS[state] || state;
  }

  function addMsg(who, text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + (cls || who);
    div.innerHTML = '<span class="who">' + who + '</span>';
    div.appendChild(document.createTextNode(text));
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function onUserMsg(text) { addMsg('user', text); }

  // --- functions called from Python ---
  function onStart() {
    setState('thinking');
    currentMsg = addMsg('jarvis', '');
  }
  function onNote(text) {
    if (currentMsg) currentMsg.lastChild.textContent = text;
    else addMsg('jarvis', text);
    chat.scrollTop = chat.scrollHeight;
  }
  function onChunk(text) {
    if (currentMsg) {
      currentMsg.lastChild.textContent += text;
      chat.scrollTop = chat.scrollHeight;
    }
  }
  function onError(text) {
    if (currentMsg) {
      currentMsg.classList.add('error');
      currentMsg.lastChild.textContent = 'Error: ' + text;
    }
    setState('idle');
  }
  function onDone() {
    currentMsg = null;
    if (document.body.className === 'thinking') setState('idle');
  }

  // --- sending ---
  function send() {
    const text = input.value.trim();
    if (!text) return;
    addMsg('user', text);
    input.value = '';
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.send_message(text);
    } else {
      addMsg('error', 'Python bridge not ready yet.', 'error');
    }
  }

  document.getElementById('sendBtn').addEventListener('click', send);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  // --- microphone toggle (Stage 2) ---
  const micBtn = document.getElementById('micBtn');
  function setMicButton(on) { micBtn.classList.toggle('active', !!on); }
  micBtn.addEventListener('click', () => {
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.toggle_mic().then(r => {
        setMicButton(r.on);
        if (document.body.className === '' || document.body.className === 'listening') {
          setState(r.state);
        }
      });
    }
  });
  function initVoice() {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.get_state) {
      window.pywebview.api.get_state().then(r => {
        setMicButton(r.on);
        if (document.body.className === '') setState(r.on ? 'listening' : 'idle');
      });
    }
  }
  window.addEventListener('pywebviewready', initVoice);
  setTimeout(initVoice, 1200);

  // --- floating particles (cheap, ~70 dots) ---
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let dots = [];
  function resize() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  }
  window.addEventListener('resize', resize);
  resize();
  for (let i = 0; i < 70; i++) {
    dots.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.8 + 0.4,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      a: Math.random() * 0.5 + 0.15
    });
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const d of dots) {
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0) d.x = canvas.width;
      if (d.x > canvas.width) d.x = 0;
      if (d.y < 0) d.y = canvas.height;
      if (d.y > canvas.height) d.y = 0;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(55,200,255,' + d.a + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();

  // --- subtle parallax so the orb feels alive ---
  document.addEventListener('mousemove', e => {
    const dx = (e.clientX / window.innerWidth - 0.5) * 14;
    const dy = (e.clientY / window.innerHeight - 0.5) * 14;
    document.getElementById('orb').style.transform =
      'translate(' + dx + 'px,' + dy + 'px)';
  });

  setState('idle');
</script>
</body>
</html>
